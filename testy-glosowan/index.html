:root{
  --bg:#f3f6f7;--surface:#fff;--tint:#e9f5f5;--line:#dce5e8;--line-strong:#75939b;
  --ink:#172f38;--ink-strong:#0f2229;--muted:#60747c;
  --primary:#087f8c;--primary-hover:#056571;--accent-text:#056571;--link:#0a6f7b;
  --ok:#23754e;--ok-bg:#e9f5ed;--warn:#956415;--warn-bg:#fff6df;--danger:#b44436;--danger-bg:#fff0ed;--info:#056571;--info-bg:#e9f5f5;--blue:#1d4f9c;--blue-bg:#e8f0fb;
  --radius:10px;--radius-sm:6px;--pill:999px;
  --shadow:0 1px 2px rgba(23,47,56,.05),0 6px 20px rgba(8,127,140,.08);
  --focus:0 0 0 3px var(--bg),0 0 0 5px var(--primary);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --max:1500px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}
h1,h2,h3{margin:0;color:var(--ink-strong);line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.375rem,1.1rem + .9vw,1.75rem);font-weight:600}
h2{font-size:1.125rem;font-weight:600}
h3{font-size:.9375rem;font-weight:600}
p{margin:0}
a{color:var(--link);text-underline-offset:.15em}
a:hover{color:var(--accent-text)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm)}
.skip-link{position:absolute;left:16px;top:-100px;padding:8px 16px;background:var(--surface);color:var(--ink-strong);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:1000}
.skip-link:focus{top:16px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.small{font-size:.8125rem}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- układ ---------- */
main{max-width:var(--max);margin-inline:auto;padding:32px clamp(16px,3vw,32px) 64px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.pagehead p{color:var(--muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- przyciski ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-strong);font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--tint);border-color:var(--primary)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{color:var(--danger);border-color:#e5bcb6}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.8125rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--radius-sm);border:1.5px solid transparent;background:transparent;color:var(--accent-text);cursor:pointer}
.iconbtn:hover{background:var(--tint)}
.iconbtn svg{width:18px;height:18px}

/* ---------- pasek narzędzi listy ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
input,select,textarea{color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 12px;min-height:40px;max-width:100%}
textarea{padding:10px 12px;min-height:110px;width:100%;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--primary);box-shadow:var(--focus)}
input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px;min-height:auto;flex-shrink:0}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:.8125rem}
.filter{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink-strong)}
.filter select{min-width:220px}

/* ---------- tabela ---------- */
.tablewrap{overflow-x:auto;max-width:100%;position:relative}
main{min-width:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font:inherit;color:inherit}
th button:hover{color:var(--accent-text)}
th button:focus-visible{box-shadow:var(--focus)}
th button svg{width:12px;height:12px;opacity:.55}
th[aria-sort] button svg{opacity:1;color:var(--accent-text)}
tbody tr:hover{background:#f8fbfb}
tbody tr:last-child td{border-bottom:0}
td.right,th.right{text-align:right}
.client{display:grid;gap:2px}
.client a{font-weight:600;text-decoration:none;color:var(--ink-strong)}
.client a:hover{color:var(--accent-text);text-decoration:underline}
.client .nr{color:var(--muted);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.dates{display:grid;gap:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dates span{color:var(--muted);font-size:.75rem;margin-right:6px;display:inline-block;width:18px}
.cell-projects{display:grid;gap:4px;justify-items:end}
.cell-projects .line{display:inline-flex;align-items:center;gap:4px}
.cell-projects .badge.pub{font-weight:500}
.infobtn{width:26px;height:26px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.infobtn:hover,.infobtn[aria-expanded="true"]{background:var(--tint);color:var(--accent-text)}
.infobtn svg{width:16px;height:16px}
.cell-voters{display:grid;gap:2px;justify-items:end}
.cell-voters .upd{font-size:.75rem;color:var(--muted);white-space:nowrap}
.tip{position:absolute;z-index:60;background:var(--ink-strong);color:#fff;padding:12px 14px;border-radius:var(--radius-sm);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:.8125rem;line-height:1.5;max-width:min(320px,calc(100vw - 16px));width:max-content}
.tip strong{display:block;margin-bottom:6px;font-weight:600}
.tip dl{margin:0;display:grid;gap:2px}
.tip dl div{display:flex;justify-content:space-between;gap:16px}
.tip dt{color:#c9d8dc}.tip dd{margin:0;font-weight:600}
.tip::before{content:"";position:absolute;left:var(--arrow-x,50%);top:-6px;transform:translateX(-50%);border:6px solid transparent;border-top:0;border-bottom-color:var(--ink-strong)}
.tip.above::before{top:auto;bottom:-6px;border-bottom:0;border-top:6px solid var(--ink-strong)}
.rowactions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:48px 24px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty svg{width:40px;height:40px;color:var(--line-strong)}

/* ---------- badge ---------- */

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.split>*{min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}

tr.diff td{background:var(--warn-bg)}

table.diffs del{background:var(--danger-bg);color:var(--danger);text-decoration:line-through;padding:1px 4px;border-radius:3px}

.field{display:grid;gap:6px;margin-bottom:16px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:var(--radius);padding:0;max-width:600px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--ink)}

const plural=(n,a,b,c)=>{n=Math.abs(n);if(n===1)return a;const m10=n%10,m100=n%100;return (m10>=2&&m10<=4&&!(m100>=12&&m100<=14))?b:c};

// Formatowanie odpowiedzi kanonicznej do tekstu (zależne czasem od innych pól — stąd cały obiekt).
function fmtAnswer(k,ans){
  const v=ans[k];
  if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)){
    if(k==='sms_unlimited_numbers')return 'nie dotyczy';
    if(k==='ip_limit')return 'brak deklaracji';
    return '—';
  }
  switch(k){
    case 'date_start':case 'date_end':return fmtDate(v)+' '+fmtTime(v);
    case 'channel':return ({electronic:'tylko elektroniczne',electronic_paper:'elektroniczne i papierowe'})[v]||v;
    case 'allocation_method':return ({per_category:`1 głos w każdej z ${ans.categories?.length||0} kategorii`,votes_per_project:`do ${ans.max_votes_total} ${plural(ans.max_votes_total,'głosu','głosów','głosów')} na dowolne projekty`,free_points:'dowolny podział punktów',budget_basket:'koszyk budżetowy'})[v]||v;
    case 'categories':return v.join(' / ');
    case 'voter_fields':return v.join(', ');
    case 'eligibility_check':return ({none:'bez bazy — oświadczenie mieszkańca',address_list:'bez bazy — po adresie (lista ulic)',residents_db:'baza mieszkańców (PESEL)'})[v]||v;
    case 'duplicate_policy':return ({first_valid:'pierwszy głos ważny, reszta nieważna',all_invalid:'wszystkie głosy nieważne'})[v]||v;

    case 'sms_unlimited_numbers':return v.join(', ');

    case 'pesel_hashed':return ans.voter_fields?.includes('PESEL')?(v?'tak':'nie'):'nie dotyczy (brak PESEL na karcie)';
    case 'info_clause':return ({previous_year:'zostaje z poprzedniego roku',new:'nowa treść — do dostarczenia przez gminę'})[v]||v;
    case 'agreements':return v.map(x=>`„${x}”`).join('; ');

    case 'incomplete_categories_warning':return v?'tak — ostrzeżenie przed wysłaniem':'nie';
    default:return typeof v==='boolean'?(v?'tak':'nie'):String(v);
  }

  if(s==='expired')head=`<div class="notice danger">${icon('alert')}<div><strong>Link do ankiety wygasł.</strong><br>Wyślij ankietę ponownie — poprzednie odpowiedzi nie zostały zapisane.${pendingInfo}</div></div>`;
  if(confirmed&&ev)head=`<div class="notice ok">${icon('check')}<div>Potwierdzone <strong>${E(ev.at)}</strong> przez <strong>${E(ev.name)}</strong> (${E(ev.position)}, ${E(ev.organization)}). ${ev.choice==='changes'?`Klient wybrał „Chcę wprowadzić zmiany” i zmienił ${changed.length} ${plural(changed.length,'pole','pola','pól')} względem edycji ${prevEd}.`:ev.choice==='confirm'?`Klient wybrał „Potwierdzam bez zmian” — zasady jak w edycji ${prevEd}.`:`Pierwsza edycja tej gminy u nas — zasady ustalone w ankiecie.`}${ev.version>1?` Wersja v${ev.version} nadpisała poprzednie odpowiedzi.`:''}</div></div>`;

  // Które odpowiedzi pokazać: potwierdzone → bieżące; brak potwierdzenia → zasady z poprzedniej edycji (jeśli klient je ma).
  const shown=confirmed?a.answers:a.previousAnswers;
  const rowsHtml=shown?SURVEY.fields.map(([k,l])=>{const ch=confirmed&&changed.includes(k);return `<tr class="${ch?'changed':''}"><td class="lbl">${E(l)}</td><td>${E(fmtAnswer(k,shown))}${ch?`<span class="tag-changed">zmienione</span>`:''}</td></tr>`}).join(''):'';
  const answersPanel=shown?`
  <section class="panel"><div class="panelhead"><h2>${confirmed?'Odpowiedzi klienta (kanoniczne)':`Zasady z edycji ${prevEd}`}</h2>${confirmed?`<span class="badge ok">${icon('check')}v${a.answersVersion} · potwierdzone</span>`:`<span class="badge">${icon('clock')}do potwierdzenia w ankiecie</span>`}</div>
    <div class="panelbody">${confirmed?'':`<p class="small muted" style="margin-bottom:12px">Zasady, na których gmina głosowała w edycji ${prevEd}. Nie są potwierdzone na edycję ${E(a.edition)} — ankieta pokaże je klientowi jako punkt wyjścia.</p>`}<div class="tablewrap"><table class="answers"><tbody>${rowsHtml}</tbody></table></div>
    ${confirmed&&a.clientNote?`<p class="small muted" style="margin-top:14px">Wolny tekst klienta: „${E(a.clientNote)}”</p>`:''}
    </div></section>`:`
  <section class="panel"><div class="panelbody"><div class="empty" style="padding:32px 16px">${icon('file')}<h3>Brak zasad głosowania</h3><p class="muted">Gmina nie głosowała z nami w poprzednich edycjach, więc nie ma czego pokazać. Zasady pojawią się tu po wypełnieniu ankiety przez klienta.</p>${s==='none'||s==='expired'?`<button type="button" class="btn primary" data-act="send" data-id="${a.id}">${icon('send')}Wyślij ankietę</button>`:''}</div></div></section>`;

  return head+answersPanel+`
  ${confirmed&&hasPrev?`<section class="panel"><div class="panelhead"><h2>Zmiany względem edycji ${prevEd}</h2>${changed.length?`<span class="small muted">${changed.length} ${plural(changed.length,'pole','pola','pól')}</span>`:''}</div><div class="panelbody">
    ${changed.length?`<div class="tablewrap"><table class="diffs"><thead><tr><th>Pole</th><th>${prevEd}</th><th>${E(a.edition)} (potwierdzone)</th></tr></thead><tbody>
    ${changed.map(k=>`<tr><td>${E(FIELD_LABEL[k])}</td><td><del>${E(fmtAnswer(k,a.previousAnswers))}</del></td><td><ins>${E(fmtAnswer(k,a.answers))}</ins></td></tr>`).join('')}
    </tbody></table></div>`:`<p class="small muted">Klient potwierdził zasady bez zmian względem edycji ${prevEd}.</p>`}
  </div></section>`:''}
  ${confirmed&&ev?`<section class="panel"><div class="panelhead"><h3>Dowód potwierdzenia</h3></div><div class="panelbody">
    <div class="kv"><span>Osoba</span><strong>${E(ev.name)}, ${E(ev.position)}, ${E(ev.organization)}</strong></div>
    <div class="kv"><span>Data</span><span>${E(ev.at)}</span></div>
    <div class="kv"><span>Wersja odpowiedzi</span><span>v${ev.version}${ev.version>1?' (poprzednie nadpisane)':''}</span></div>
    <div class="kv"><span>Oświadczenie</span><span class="small">${E(SURVEY.closing)}</span></div>
    <div class="kv"><span>Suma kontrolna</span><span class="small">${E(ev.hash)}</span></div>
  </div></section>`:''}`;
}

function openSend(a,mode){

  document.getElementById('dlg-send-title').textContent=remind?'Przypomnij o ankiecie':resend?'Wyślij ankietę ponownie':'Wyślij ankietę';
  document.getElementById('dlg-send-body').innerHTML=`
    ${resend?`<div class="notice warn">${icon('alert')}<div><strong>Klient potwierdził już odpowiedzi v${a.answersVersion} (${E(a.evidence?.at||'')}).</strong><br>Po nowym potwierdzeniu odpowiedzi dla edycji ${E(a.edition)} zostaną nadpisane wersją v${a.answersVersion+1}. Do tego czasu obowiązuje v${a.answersVersion}. Test trzeba będzie powtórzyć.</div></div>`:''}
    <div class="field"><label for="send-to">Adres e-mail odbiorcy w gminie · ${E(a.client)}</label><input id="send-to" type="email" autocomplete="email" placeholder="np. bo@gmina.pl" required><span class="hint">Dane kontaktowe prowadzisz w CRM — tu wpisz tylko adres, na który ma trafić link.</span></div>

    <p class="small muted">Link będzie ważny 14 dni. Po potwierdzeniu odpowiedzi klienta zostaną zablokowane do edycji.</p>`;
  const ok=document.getElementById('dlg-send-ok');
  ok.innerHTML=icon('send')+(remind?'Wyślij przypomnienie':resend?'Wyślij ponownie':'Wyślij ankietę');

    else if(resend){a.survey='sent';a.test='blocked';a.expires='2026-10-01';addEvent(a,`Wysłano ankietę ponownie na ${to.value} — po potwierdzeniu nadpisze v${a.answersVersion}`);toast('Ankieta wysłana ponownie na '+to.value+'. Odpowiedzi v'+a.answersVersion+' obowiązują do nowego potwierdzenia.');}
    else{a.survey='sent';a.test='blocked';a.expires='2026-10-01';addEvent(a,'Wysłano ankietę na '+to.value);toast('Ankieta wysłana na '+to.value+'. Link ważny do '+fmtDate(a.expires)+'.');}
    dlg.close();render();
  };
  dlg.showModal();
}

document.addEventListener('click',e=>{
  const srt=e.target.closest('[data-sort]');if(srt){const k=srt.dataset.sort;if(sort.key===k)sort.dir*=-1;else sort={key:k,dir:1};render();return}

      const org=a.evidence?.organization||(/^(Urząd Miasta|Miasto) /.test(a.client)?a.client.replace(/^Miasto /,'Urząd Miasta '):'Urząd Gminy '+a.client);
      if(!a.answers){a.answers=JSON.parse(JSON.stringify(a.previousAnswers||baseAnswers(org)));a.answers.date_start=a.start;a.answers.date_end=a.end;a.answers.edition_year_label=a.edition;}
      a.answers.sms_per_phone_limit=a.answers.sms_per_phone_limit===1?2:1;a.answers.duplicate_policy='first_valid';if(v>1)a.answers.max_votes_total=a.answers.max_votes_total===3?4:3;
      a.platform=pick(a.answers,TEST_KEYS);
      a.answersVersion=v;a.survey='confirmed';a.test='blocked';a.checks={};
      a.evidence={name:a.evidence?.name||'Anna Kowalczyk',position:a.evidence?.position||'inspektor ds. partycypacji',organization:org,at:now(),choice:!a.previousAnswers?'new':changedFields(a.answers,a.previousAnswers).length?'changes':'confirm',version:v,hash:'SHA-256 · '+Math.random().toString(16).slice(2,8)+'…demo'};
      addEvent(a,`Klient potwierdził zasady (v${v})${v>1?' — poprzednie odpowiedzi nadpisane':''}`,a.evidence.name);addEvent(a,prevNote,'system');tab='Klient';render();toast(prevNote+'.');break}
    case 'test':location.hash=`#klient/${a.id}/Test`;break;
    case 'note':location.hash=`#klient/${a.id}/${encodeURIComponent('Rozmowy i notatki')}`;setTimeout(()=>document.getElementById('note-text')?.focus(),50);break;
    case 'rerun':{const d=unresolved(a);a.test=d.length?'internal_issues':(a.checks.client?'client_ok':'internal_ok');addEvent(a,d.length?`Test wewnętrzny: ${d.length} ${plural(d.length,'rozbieżność','rozbieżności','rozbieżności')}`:'Test wewnętrzny: bez rozbieżności');render();toast(d.length?'Porównanie zakończone: są rozbieżności.':'Porównanie zakończone: konfiguracja zgodna.');break}
    case 'ready':a.test='ready';addEvent(a,'Oznaczono jako gotowe do startu');render();toast(a.client+': gotowe do startu.');break;
    case 'edit-rules':toast('Edycja zasad — w makiecie tylko podgląd.');break;
    case 'upload':toast('Wgrywanie plików — w makiecie tylko podgląd.');break;

  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-window]')){startWindow=e.target.value;render();return}

document.addEventListener('submit',e=>{

const tip=document.createElement('div');tip.id='proj-tip';tip.className='tip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
let tipFor=null,tipPinned=false,tipHideT=null;
function tipContent(a){
  const c=a.projectStatusCounts;const total=Object.values(c).reduce((x,y)=>x+y,0);
  return `<strong>${E(a.client)} · ${total} ${plural(total,'projekt','projekty','projektów')}</strong><dl>${PROJECT_STATUS_LABELS.map(([k,l])=>`<div><dt>${l}:</dt><dd class="num">${c[k]}</dd></div>`).join('')}</dl>`;
}
function positionTip(btn){
  const r=btn.getBoundingClientRect();const pad=8;
  tip.style.left='0px';tip.style.top='0px';
  const tw=tip.offsetWidth,thh=tip.offsetHeight;
  let left=r.left+r.width/2-tw/2;left=Math.max(pad,Math.min(left,window.innerWidth-tw-pad));
  let top=r.bottom+8;let above=false;
  if(top+thh>window.innerHeight-pad&&r.top-thh-8>pad){top=r.top-thh-8;above=true}
  tip.style.left=Math.round(left+window.scrollX)+'px';tip.style.top=Math.round(top+window.scrollY)+'px';
  tip.classList.toggle('above',above);
  tip.style.setProperty('--arrow-x',Math.round(r.left+r.width/2-left)+'px');
}
function showTip(btn,pin){
  clearTimeout(tipHideT);
  const a=byId(btn.dataset.projinfo);if(!a)return;
  if(tipFor&&tipFor!==btn)tipFor.setAttribute('aria-expanded','false');
  tipFor=btn;tipPinned=pin||tipPinned&&tipFor===btn;
  tip.innerHTML=tipContent(a);tip.hidden=false;positionTip(btn);
  btn.setAttribute('aria-expanded','true');
}
function hideTip(force){
  if(tipPinned&&!force)return;
  tip.hidden=true;tipPinned=false;
  if(tipFor){tipFor.setAttribute('aria-expanded','false');tipFor=null}
}
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-projinfo]');if(b)showTip(b,false)});
document.addEventListener('mouseout',e=>{const b=e.target.closest('[data-projinfo]');if(b&&!tipPinned){tipHideT=setTimeout(()=>hideTip(false),120)}});
tip.addEventListener('mouseenter',()=>clearTimeout(tipHideT));
tip.addEventListener('mouseleave',()=>{if(!tipPinned)hideTip(false)});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-projinfo]');if(b)showTip(b,false)});
document.addEventListener('focusout',e=>{const b=e.target.closest('[data-projinfo]');if(b&&!tipPinned)hideTip(false)});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-projinfo]');
  if(b){e.preventDefault();if(tipPinned&&tipFor===b){hideTip(true)}else{showTip(b,true)}return}
  if(!tip.hidden&&!e.target.closest('#proj-tip'))hideTip(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!tip.hidden){const f=tipFor;hideTip(true);f?.focus()}});
window.addEventListener('scroll',()=>{if(!tip.hidden&&tipFor)positionTip(tipFor)},{passive:true});
window.addEventListener('resize',()=>{if(!tip.hidden&&tipFor)positionTip(tipFor)});
route();
</script>
</body>
</html>
