<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testy głosowań — MediaPark — makieta</title>
<meta name="description" content="Makieta systemu do testowania głosowań w budżecie obywatelskim: lista klientów ze statusem ankiety i testów, wysyłka jednej ankiety, potwierdzenia, karta klienta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap&subset=latin-ext">
<style>
:root{
  --bg:#f3f6f7;--surface:#fff;--tint:#e9f5f5;--line:#dce5e8;--line-strong:#75939b;
  --ink:#172f38;--ink-strong:#0f2229;--muted:#60747c;
  --primary:#087f8c;--primary-hover:#056571;--accent-text:#056571;--link:#0a6f7b;
  --ok:#23754e;--ok-bg:#e9f5ed;--warn:#956415;--warn-bg:#fff6df;--danger:#b44436;--danger-bg:#fff0ed;--info:#056571;--info-bg:#e9f5f5;
  --radius:10px;--radius-sm:6px;--pill:999px;
  --shadow:0 1px 2px rgba(23,47,56,.05),0 6px 20px rgba(8,127,140,.08);
  --focus:0 0 0 3px var(--bg),0 0 0 5px var(--primary);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --max:1500px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}
h1,h2,h3{margin:0;color:var(--ink-strong);line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.375rem,1.1rem + .9vw,1.75rem);font-weight:600}
h2{font-size:1.125rem;font-weight:600}
h3{font-size:.9375rem;font-weight:600}
p{margin:0}
a{color:var(--link);text-underline-offset:.15em}
a:hover{color:var(--accent-text)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm)}
.skip-link{position:absolute;left:16px;top:-100px;padding:8px 16px;background:var(--surface);color:var(--ink-strong);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:1000}
.skip-link:focus{top:16px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.small{font-size:.8125rem}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- pasek górny ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .inner{max-width:var(--max);margin-inline:auto;padding:0 clamp(16px,3vw,32px);min-height:64px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink-strong)}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.02em}
.brand strong{font-weight:600;display:block;line-height:1.15}
.brand span{display:block;font-size:.75rem;color:var(--muted)}
.topbar .spacer{flex:1}
.demo{font-size:.75rem;padding:4px 10px;background:var(--warn-bg);color:var(--warn);border-radius:var(--pill);font-weight:500}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:.75rem}

/* ---------- układ ---------- */
main{max-width:var(--max);margin-inline:auto;padding:24px clamp(16px,3vw,32px) 64px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.pagehead p{color:var(--muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- przyciski ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-strong);font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--tint);border-color:var(--primary)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{color:var(--danger);border-color:#e5bcb6}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.8125rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--radius-sm);border:1.5px solid transparent;background:transparent;color:var(--accent-text);cursor:pointer}
.iconbtn:hover{background:var(--tint)}
.iconbtn svg{width:18px;height:18px}

/* ---------- kafle statusów (zastępują zakładki raportów) ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 18px;cursor:pointer;display:grid;gap:2px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:var(--primary)}
.stat[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--tint)}
.stat .lbl{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.stat .dot.warn{background:#cb982c}.stat .dot.danger{background:var(--danger)}.stat .dot.ok{background:var(--ok)}.stat .dot.muted{background:var(--line-strong)}
.stat .val{font-size:1.75rem;font-weight:600;color:var(--ink-strong);line-height:1.2}
.stat .sub{font-size:.75rem;color:var(--muted)}

/* ---------- pasek narzędzi listy ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.segments{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:3px;background:var(--bg);gap:2px}
.segments button{border:0;border-radius:4px;padding:6px 12px;background:transparent;color:var(--ink);font-weight:500;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.segments button .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.segments button[aria-pressed="true"]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segments button[aria-pressed="true"] .n{color:var(--accent-text)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;padding-left:36px}
input,select,textarea{color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 12px;min-height:40px;max-width:100%}
textarea{padding:10px 12px;min-height:110px;width:100%;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--primary);box-shadow:var(--focus)}
input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px;min-height:auto;flex-shrink:0}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:.8125rem}
.clearfilter{display:none}
.clearfilter.on{display:inline-flex}

/* ---------- tabela ---------- */
.tablewrap{overflow-x:auto;max-width:100%;position:relative}
main{min-width:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font:inherit;color:inherit}
th button:hover{color:var(--accent-text)}
th button:focus-visible{box-shadow:var(--focus)}
th button svg{width:12px;height:12px;opacity:.55}
th[aria-sort] button svg{opacity:1;color:var(--accent-text)}
tbody tr:hover{background:#f8fbfb}
tbody tr:last-child td{border-bottom:0}
td.right,th.right{text-align:right}
.client{display:grid;gap:2px}
.client a{font-weight:600;text-decoration:none;color:var(--ink-strong)}
.client a:hover{color:var(--accent-text);text-decoration:underline}
.client .nr{color:var(--muted);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.dates{display:grid;gap:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dates span{color:var(--muted);font-size:.75rem;margin-right:6px;display:inline-block;width:18px}
.contact{display:grid;gap:2px;max-width:170px}
.contact .who{font-weight:500}
.contact .links{display:flex;gap:4px;margin-top:2px}
.rowactions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:48px 24px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty svg{width:40px;height:40px;color:var(--line-strong)}

/* ---------- badge ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--pill);font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge svg{width:12px;height:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.cell-status{display:grid;gap:4px;justify-items:start}
.cell-status .when{font-size:.75rem;color:var(--muted);max-width:170px}
.cell-status a.small{font-size:.75rem}

/* ---------- karta klienta ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;text-decoration:none;color:var(--muted);margin-bottom:8px}
.back:hover{color:var(--accent-text)}
.back svg{width:14px;height:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.meta div{padding:14px 18px;border-right:1px solid var(--line);display:grid;gap:2px}
.meta div:last-child{border-right:0}
.meta span{font-size:.75rem;color:var(--muted)}
.meta strong{font-weight:600;color:var(--ink-strong)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.split>*{min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--ink-strong)}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--primary)}
.tabs .pillnum{background:var(--danger);color:#fff;border-radius:var(--pill);font-size:.6875rem;padding:1px 7px;font-weight:600}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panelbody{padding:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.875rem}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.notice{display:flex;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid transparent;margin-bottom:16px;align-items:flex-start}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.danger{background:var(--danger-bg);color:var(--danger)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check label{display:grid;gap:2px;cursor:pointer;flex:1}
.check .hint{font-size:.75rem;color:var(--muted)}
.check .by{font-size:.75rem;color:var(--ok)}
.mono{font-family:Consolas,"SF Mono",monospace;font-size:.75rem;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;overflow:auto;max-height:320px;margin:0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline time{font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.timeline .by{font-size:.75rem;color:var(--muted)}
tr.diff td{background:var(--warn-bg)}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:500;color:var(--ink-strong)}
.field .hint{font-size:.8125rem;color:var(--muted)}
.dropzone{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:var(--radius);padding:0;max-width:600px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(15,34,41,.5)}
dialog .dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog .dbody{padding:22px}
dialog .dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;font-size:.875rem}
.preview ol{margin:8px 0 0;padding-left:20px}
.preview li{margin:4px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink-strong);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);font-size:.875rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .segments{width:100%}.segments button{flex:1;justify-content:center}
  .search{max-width:none}
  .toolbar .count{margin-left:0;width:100%}
  .rowactions{justify-content:flex-start}
  .topbar .inner{gap:12px}.brand span{display:none}.user .name{display:none}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="topbar">
  <div class="inner">
    <a class="brand" href="#lista" aria-label="Testy głosowań, strona główna">
      <span class="mark" aria-hidden="true">MP</span>
      <span><strong>Testy głosowań</strong><span>Budżet obywatelski · MediaPark</span></span>
    </a>
    <span class="spacer"></span>
    <span class="demo">Makieta · dane przykładowe</span>
    <div class="user"><span class="avatar" aria-hidden="true">AK</span><span class="name small">Anna — opiekun</span></div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<dialog id="dlg-send" aria-labelledby="dlg-send-title">
  <form method="dialog">
    <div class="dhead"><h2 id="dlg-send-title">Wyślij ankietę</h2><button type="button" class="iconbtn" data-close aria-label="Zamknij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="dbody" id="dlg-send-body"></div>
    <div class="dfoot"><button type="button" class="btn" data-close>Nie wysyłaj</button><button type="button" class="btn primary" id="dlg-send-ok"></button></div>
  </form>
</dialog>

<div class="toast" role="status" aria-live="polite" id="toast"></div>

<script>
/* ============================================================
   DANE (na sztywno — makieta)
   ============================================================ */
const VERSION='testy-glosowan-v1';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>{n=Math.abs(n);if(n===1)return a;const m10=n%10,m100=n%100;return (m10>=2&&m10<=4&&!(m100>=12&&m100<=14))?b:c};

// Jedna ankieta — stała, wysyłana do każdego klienta w identycznej treści.
const SURVEY={
  title:'Ustalenia głosowania — potwierdzenie zasad',
  questions:[
    ['date_start','Rozpoczęcie głosowania (data i godzina)'],
    ['date_end','Zakończenie głosowania (data i godzina)'],
    ['max_votes_total','Maksymalna liczba głosów na mieszkańca'],
    ['eligibility_check','Sposób weryfikacji uprawnień (baza mieszkańców / adres / brak)'],
    ['sms_verification','Weryfikacja SMS (tak / nie)'],
    ['sms_per_phone_limit','Limit głosów na jeden numer telefonu'],
    ['age_rule','Zasady wieku i zgoda rodzica'],
    ['info_clause','Klauzula informacyjna: z poprzedniej edycji czy nowa'],
  ],
  closing:'Oświadczam, że powyższe zasady są zgodne z obowiązującą uchwałą/regulaminem BO i na ich podstawie ma zostać skonfigurowane głosowanie.'
};

// Statusy ankiety (jedna oś) i testów (druga oś) — rozdzielone, bo odpowiadają za nie różne osoby.
const SURVEY_STATUS={
  none:      {label:'Nie wysłana',        cls:'',       ico:'mail'},
  sent:      {label:'Wysłana',            cls:'info',   ico:'send'},
  opened:    {label:'Otwarta, bez odpowiedzi',cls:'info',  ico:'eye'},
  confirmed: {label:'Potwierdzona',       cls:'ok',     ico:'check'},
  changes:   {label:'Wymagane zmiany',    cls:'danger', ico:'alert'},
  expired:   {label:'Link wygasł',        cls:'danger', ico:'alert'},
};
const TEST_STATUS={
  none:     {label:'Nie rozpoczęty',            cls:'',      ico:'circle'},
  blocked:  {label:'Po potwierdzeniu',         cls:'',      ico:'clock'},
  internal_issues:{label:'Rozbieżności w teście',cls:'danger',ico:'alert'},
  internal_ok:{label:'Test wewnętrzny OK',      cls:'info',  ico:'check'},
  client_ok:{label:'Test z klientem OK',        cls:'info',  ico:'check'},
  ready:    {label:'Gotowe do startu',          cls:'ok',    ico:'flag'},
  running:  {label:'Głosowanie trwa',           cls:'ok',    ico:'play'},
  finished: {label:'Zakończone',                cls:'',      ico:'check'},
};

const CHECKS=[
  ['db','Baza uprawnionych wgrana i przetestowana','Tylko przy weryfikacji w bazie mieszkańców.'],
  ['projects','Projekty do głosowania opublikowane','Widoczność i kompletność listy.'],
  ['numbers','Numery projektów zgodne z zasadami','Kolejność i ciągłość numeracji.'],
  ['year','Rok edycji spójny we wszystkich miejscach','Karta, zgoda rodzica, klauzula, slogan.'],
  ['content','Klauzula i oświadczenia sprawdzone','Pełna treść zgodna z potwierdzeniem klienta.'],
  ['variants','Warianty testowe przekazane klientowi','Ścieżki poprawnego i błędnego głosowania.'],
  ['internal','Test wewnętrzny wykonany','Zapisuje osobę i datę.'],
  ['client','Test z klientem wykonany','Zapisuje osobę i datę.'],
  ['prestart','Kontrola przed startem wykonana','Ostatnie sprawdzenie przed uruchomieniem.'],
];

function seed(){
  // [klient, od, do, projekty, uprawnieni, weryfikacja, ankieta, test, kontakt, stanowisko, e-mail, telefon, opiekun]
  const rows=[
    ['Śrem','2026-09-18T00:00','2026-09-27T23:59',5,0,'none','sent','blocked','Marta Wiśniewska','Koordynatorka BO','bo@srem.pl','61 283 00 01','Anna'],

const TODAY=new Date('2026-09-17T12:00:00');
function phase(a){const s=new Date(a.start),e=new Date(a.end);if(TODAY<s)return 'upcoming';if(TODAY>e)return 'finished';return 'running'}
function withinRange(a){if(seg!=='upcoming'||range==='all')return true;const days={'2w':14,'1m':31,'3m':92}[range];const s=new Date(a.start);return (s-TODAY)/86400000<=days}
function quickMatch(a){
  switch(quick){
    case 'nosurvey':return a.survey==='none'||a.survey==='expired';
    case 'waiting':return a.survey==='sent'||a.survey==='opened';
    case 'issues':return a.test==='internal_issues'||a.survey==='changes';
    case 'ready':return a.test==='ready';
    default:return true;
  }
}
function filtered(){
  let arr=S.filter(a=>phase(a)===seg).filter(withinRange).filter(quickMatch);
  if(q){const n=q.toLowerCase();arr=arr.filter(a=>a.client.toLowerCase().includes(n)||a.contact.toLowerCase().includes(n)||a.owner.toLowerCase().includes(n))}
  const val=a=>({client:a.client,start:a.start,end:a.end,projects:a.projects,eligible:a.eligible,survey:Object.keys(SURVEY_STATUS).indexOf(a.survey),test:Object.keys(TEST_STATUS).indexOf(a.test)})[sort.key];
  arr.sort((x,y)=>{const a=val(x),b=val(y);return (a>b?1:a<b?-1:0)*sort.dir||x.client.localeCompare(y.client,'pl')});
  return arr;
}
// Główna akcja wiersza — zależy od tego, na czym stanęła sprawa.
function primaryAction(a){
  if(phase(a)==='finished')return null;
  if(a.survey==='none'||a.survey==='expired')return {label:a.survey==='expired'?'Wyślij ponownie':'Wyślij ankietę',act:'send',ico:'send'};
  if(a.survey==='sent'||a.survey==='opened')return {label:'Przypomnij',act:'remind',ico:'mail'};
  if(a.survey==='changes')return {label:'Wyślij poprawioną',act:'send',ico:'send'};
  if(a.test==='blocked'||a.test==='none')return {label:'Uruchom test',act:'test',ico:'play'};
  if(a.test==='internal_issues')return {label:'Rozbieżności',act:'test',ico:'alert',cls:'danger'};
  if(a.test==='internal_ok')return {label:'Test z klientem',act:'test',ico:'play'};
  if(a.test==='client_ok')return {label:'Przed startem',act:'test',ico:'flag'};
  return null;
}
function surveyCell(a){

  if(a.survey==='changes')when='08.09 · zobacz uwagi klienta';
  if(a.survey==='expired')when='wygasł 19.09 · wyślij ponownie';
  return `<div class="cell-status">${badge(d)}${when?`<span class="when">${E(when)}</span>`:''}</div>`;
}
function testCell(a){

  if(a.test==='internal_issues')extra=`<a class="small" href="#klient/${a.id}/Test">2 rozbieżności → raport</a>`;

}
function projectsCell(a){

    <div>
      <div class="tabs" role="tablist" aria-label="Sekcje karty klienta">
        ${tabs.map(t=>`<button type="button" role="tab" aria-selected="${tab===t}" data-tab="${t}">${t}${t==='Test'&&diff?`<span class="pillnum" aria-label="${diff} ${plural(diff,'rozbieżność','rozbieżności','rozbieżności')}">${diff}</span>`:''}</button>`).join('')}
      </div>
      <div role="tabpanel">${({'Klient':tabClient,'Uchwała':tabResolution,'Platforma':tabPlatform,'Test':tabTest,'Rozmowy i notatki':tabNotes})[tab](a)}</div>
    </div>
    <aside>
      <section class="panel"><div class="panelhead"><h3>Kontakt w gminie</h3></div><div class="panelbody">
        <strong>${E(a.contact)}</strong><p class="small muted">${E(a.position)}</p>
        <p style="margin-top:12px"><a href="mailto:${E(a.email)}">${E(a.email)}</a></p>
        <p><a href="tel:${E(a.phone.replace(/\s/g,''))}">${E(a.phone)}</a></p>
        <div class="actions" style="margin-top:14px">
          <button type="button" class="btn sm" data-act="${a.survey==='none'||a.survey==='expired'||a.survey==='changes'?'send':'remind'}" data-id="${a.id}">${icon('send')}${a.survey==='none'||a.survey==='expired'?'Wyślij ankietę':a.survey==='changes'?'Wyślij poprawioną':'Przypomnij o ankiecie'}</button>
          <button type="button" class="btn sm" data-act="note" data-id="${a.id}">Dodaj notatkę</button>
        </div>
      </div></section>
      <section class="panel"><div class="panelhead"><h3>Historia</h3></div><div class="panelbody">
        <ol class="timeline">${a.events.slice(0,6).map(e=>`<li><time>${E(e.at)}</time><div>${E(e.text)}<div class="by">${E(e.by)}</div></div></li>`).join('')}</ol>
      </div></section>
    </aside>
  </div>`;
}
function tabClient(a){
  const s=a.survey;
  let head='';
  if(s==='none')head=`<div class="notice info">${icon('mail')}<div><strong>Ankieta nie została jeszcze wysłana.</strong><br>Klient otrzyma link do jednej, stałej ankiety z zasadami głosowania i potwierdzi je oświadczeniem.</div></div>`;
  if(s==='sent'||s==='opened')head=`<div class="notice warn">${icon('clock')}<div><strong>${s==='opened'?'Klient otworzył ankietę, ale jej nie potwierdził.':'Czekamy na odpowiedź klienta.'}</strong><br>Link ważny do ${fmtDate(a.expires)}. Test nie ruszy bez potwierdzenia.</div></div>`;
  if(s==='changes')head=`<div class="notice danger">${icon('alert')}<div><strong>Klient zgłosił zmiany.</strong><br>„Głosowanie do 27.09 15:59, nie 23:59”. Popraw zasady i wyślij ankietę ponownie.</div></div>`;
  if(s==='expired')head=`<div class="notice danger">${icon('alert')}<div><strong>Link do ankiety wygasł.</strong><br>Wyślij ankietę ponownie — poprzednie odpowiedzi nie zostały zapisane.</div></div>`;
  if(s==='confirmed')head=`<div class="notice ok">${icon('check')}<div><strong>Zasady potwierdzone przez klienta.</strong><br>Potwierdzenie jest zablokowane do edycji. Zmiany wymagają nowej ankiety.</div></div>`;
  return head+`
  <section class="panel"><div class="panelhead"><h2>${s==='confirmed'?'Potwierdzone zasady · v1':'Zasady do potwierdzenia'}</h2>${s!=='confirmed'?`<button type="button" class="btn sm" data-act="edit-rules" data-id="${a.id}">Edytuj zasady</button>`:''}</div>
    <div class="panelbody"><div class="tablewrap"><table><tbody>${SURVEY.questions.map(([k,l])=>`<tr><td style="width:45%">${E(l)}</td><td>${E(showVal(k,a.rules[k]))}</td></tr>`).join('')}</tbody></table></div></div></section>
  ${a.evidence?`<section class="panel"><div class="panelhead"><h3>Dowód potwierdzenia</h3></div><div class="panelbody">
    <div class="kv"><span>Osoba</span><strong>${E(a.evidence.name)}, ${E(a.evidence.position)}</strong></div>
    <div class="kv"><span>E-mail</span><span>${E(a.evidence.email)}</span></div>
    <div class="kv"><span>Data</span><span>${E(a.evidence.at)}</span></div>
    <div class="kv"><span>Oświadczenie</span><span class="small">${E(SURVEY.closing)}</span></div>
    <div class="kv"><span>Suma kontrolna</span><span class="small">${E(a.evidence.hash)}</span></div>
  </div></section>`:''}`;
}
function tabResolution(a){
  return a.resolution?`
  <section class="panel"><div class="panelhead"><h2>Uchwała i regulamin</h2><button type="button" class="btn sm" data-act="upload" data-id="${a.id}">Wgraj nową wersję</button></div><div class="panelbody">
    <div class="kv"><span>Plik</span><a href="#">${E(a.resolution.file)}</a></div>
    <p class="small muted" style="margin:12px 0">Pola odczytane z dokumentu. Zatwierdź każde, żeby trafiło do porównania w Teście.</p>
    <div class="tablewrap"><table><thead><tr><th>Pole</th><th>Wartość z uchwały</th><th>Cytat</th><th></th></tr></thead><tbody>
    ${Object.entries(a.resolution.fields).map(([k,f])=>`<tr><td>${E(SURVEY.questions.find(x=>x[0]===k)?.[1]||k)}</td><td>${E(showVal(k,f.value))}</td><td class="small muted">„${E(f.quote)}”</td><td><button type="button" class="btn sm" data-act="toast" data-msg="Pole zatwierdzone (demo)">Zatwierdź</button></td></tr>`).join('')}
    </tbody></table></div>
  </div></section>`:`
  <section class="panel"><div class="panelhead"><h2>Uchwała i regulamin</h2></div><div class="panelbody">
    <div class="notice info">${icon('file')}<div><strong>Brak uchwały dla tej edycji.</strong><br>Bez uchwały test porówna tylko potwierdzenie klienta z konfiguracją platformy.</div></div>
    <div class="dropzone">Przeciągnij plik PDF lub DOCX albo <button type="button" class="btn sm" data-act="upload" data-id="${a.id}">wybierz z dysku</button></div>
  </div></section>`;
}
function tabPlatform(a){
  return `
  <section class="panel"><div class="panelhead"><h2>Konfiguracja platformy</h2><div class="actions"><button type="button" class="btn sm" data-act="toast" data-msg="Pobrano aktualne ustawienia z platformy (demo)">${icon('refresh')}Pobierz z platformy</button></div></div><div class="panelbody">
    <div class="kv"><span>Adres</span><a href="${E(a.platformUrl)}" target="_blank" rel="noopener">${E(a.platformUrl)}</a></div>
    <div class="kv"><span>Ostatni snapshot</span><span>11.09.2026, 08:10 · v1</span></div>
    <div class="kv"><span>Połączenie</span><span class="badge ok">${icon('check')}API dostępne</span></div>
    <p class="small muted" style="margin:14px 0 8px">Ustawienia głosowania odczytane z panelu gminy (tylko pola objęte ankietą):</p>
    <pre class="mono">${E(JSON.stringify(a.platform,null,2))}</pre>
  </div></section>`;
}
function showVal(k,v){
  if(v===null||v===undefined||v==='')return '—';
  if(k==='date_start'||k==='date_end')return fmtLong(v);
  if(k==='eligibility_check')return ({none:'Brak weryfikacji w bazie',residents_db:'Baza mieszkańców',address_list:'Lista adresów'})[v]||v;
  if(k==='age_rule')return ({min_age_parent_consent:'Min. 16 lat, zgoda rodzica dla młodszych',no_limit:'Bez limitu wieku'})[v]||v;
  if(k==='info_clause')return ({new:'Nowa klauzula',previous_year:'Z poprzedniej edycji'})[v]||v;
  if(typeof v==='boolean')return v?'Tak':'Nie';
  return String(v);
}
function tabTest(a){
  if(a.survey!=='confirmed')return `<section class="panel"><div class="panelbody"><div class="notice warn" style="margin:0">${icon('clock')}<div><strong>Test czeka na potwierdzenie ankiety.</strong><br>Porównanie zasad ma sens dopiero, gdy klient potwierdzi, co ma być skonfigurowane.</div></div></div></section>`;
  const diffs=unresolved(a);
  return `
  ${diffs.length?`<div class="notice danger">${icon('alert')}<div><strong>${diffs.length} ${plural(diffs.length,'rozbieżność','rozbieżności','rozbieżności')} między potwierdzeniem klienta a platformą.</strong><br>Popraw ustawienia w panelu gminy albo zapisz decyzję, dlaczego różnica jest dopuszczalna.</div></div>`:`<div class="notice ok">${icon('check')}<div><strong>Konfiguracja platformy zgodna z potwierdzeniem klienta.</strong><br>Możesz przejść do listy kontrolnej i testu z klientem.</div></div>`}
  <section class="panel"><div class="panelhead"><h2>Porównanie: klient · uchwała · platforma</h2><button type="button" class="btn sm primary" data-act="rerun" data-id="${a.id}">${icon('play')}Uruchom porównanie</button></div><div class="panelbody">
    <div class="tablewrap"><table><thead><tr><th>Pole</th><th>Potwierdzenie klienta</th><th>Uchwała</th><th>Platforma</th><th>Wynik</th></tr></thead><tbody>
    ${SURVEY.questions.map(([k,l])=>{const d=diffs.includes(k);const r=a.resolution?.fields?.[k];return `<tr class="${d?'diff':''}"><td>${E(l)}</td><td>${E(showVal(k,a.rules[k]))}</td><td class="${r?'':'muted'}">${r?E(showVal(k,r.value)):'—'}</td><td>${E(showVal(k,a.platform[k]))}</td><td>${d?`<span class="badge danger">${icon('alert')}różni się</span>`:`<span class="badge ok">${icon('check')}zgodne</span>`}</td></tr>`}).join('')}
    </tbody></table></div>
  </div></section>
  <section class="panel"><div class="panelhead"><h2>Lista kontrolna przed startem</h2><span class="small muted">${Object.keys(a.checks).length}/${CHECKS.length}</span></div><div class="panelbody">
    ${CHECKS.map(([k,t,h])=>{const c=a.checks[k];return `<div class="check"><input type="checkbox" id="chk-${k}" data-check="${k}" data-id="${a.id}" ${c?'checked':''}><label for="chk-${k}"><span>${E(t)}</span><span class="hint">${E(h)}</span>${c?`<span class="by">${E(c.by)} · ${E(c.at)}</span>`:''}</label></div>`}).join('')}
    <div class="actions" style="margin-top:16px"><button type="button" class="btn primary" data-act="ready" data-id="${a.id}" ${Object.keys(a.checks).length<CHECKS.length||diffs.length?'disabled':''}>${icon('flag')}Oznacz jako gotowe do startu</button>${Object.keys(a.checks).length<CHECKS.length||diffs.length?`<span class="small muted">Wymaga wszystkich pozycji listy i braku rozbieżności.</span>`:''}</div>
  </div></section>`;
}
function tabNotes(a){
  return `
  <section class="panel"><div class="panelhead"><h2>Rozmowy i notatki</h2></div><div class="panelbody">
    <form data-form="note" data-id="${a.id}">
      <div class="field"><label for="note-text">Nowy wpis</label><textarea id="note-text" name="text" placeholder="Co ustaliliście z klientem, co trzeba sprawdzić…" required></textarea></div>
      <div class="actions"><button type="submit" class="btn primary">Dodaj wpis</button></div>
    </form>
    ${a.notes.length?`<ol class="timeline" style="margin-top:20px">${a.notes.map(n=>`<li><time>${E(n.at)}</time><div>${E(n.text)}<div class="by">${E(n.by)}</div></div></li>`).join('')}</ol>`:`<p class="small muted" style="margin-top:20px">Brak notatek. Zapisuj tu ustalenia z rozmów — trafią do historii klienta.</p>`}
  </div></section>`;
}

/* ============================================================
   RENDER I ROUTING
   ============================================================ */
const main=document.getElementById('main');
function render(){
  if(view==='klient'){const a=byId(currentId);if(!a){location.hash='#lista';return}main.innerHTML=renderDetail(a);document.title=a.client+' — Testy głosowań';}
  else{main.innerHTML=renderList();document.title='Testy głosowań — MediaPark — makieta';}
}
function route(){
  const h=location.hash.replace('#','')||'lista';
  const [v,id,t]=h.split('/');
  if(v==='klient'&&id){view='klient';currentId=Number(id);if(t)tab=decodeURIComponent(t);}
  else{view='lista';}
  render();
  main.focus({preventScroll:true});
  window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);

/* ============================================================
   ZDARZENIA
   ============================================================ */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),4500)}
function addEvent(a,text,by){a.events.unshift({text,by:by||a.owner,at:now()});save()}

const dlg=document.getElementById('dlg-send');
function openSend(a,mode){
  const remind=mode==='remind';
  document.getElementById('dlg-send-title').textContent=remind?'Przypomnij o ankiecie':'Wyślij ankietę';
  document.getElementById('dlg-send-body').innerHTML=`
    <p class="small muted" style="margin-bottom:12px">Do: <strong>${E(a.contact)}</strong> &lt;${E(a.email)}&gt; · ${E(a.client)}</p>
    <div class="preview">
      <strong>${remind?'Przypomnienie: ':''}${E(SURVEY.title)}</strong>
      <p class="small muted" style="margin-top:4px">Ta sama ankieta dla każdej gminy. Klient odpowiada na pytania i podpisuje oświadczenie.</p>
      <ol>${SURVEY.questions.map(([,l])=>`<li>${E(l)}</li>`).join('')}</ol>
      <p class="small" style="margin-top:10px"><em>${E(SURVEY.closing)}</em></p>
    </div>
    <div class="field" style="margin-top:16px"><label for="send-msg">Wiadomość do klienta (opcjonalnie)</label><textarea id="send-msg" rows="3" placeholder="np. Prosimy o potwierdzenie do piątku — wtedy zdążymy z testem przed startem.">${remind?'Dzień dobry, przypominamy o ankiecie z zasadami głosowania. Link jest ważny do '+fmtDate(a.expires)+'.':''}</textarea></div>
    <p class="small muted">Link będzie ważny 14 dni. Po potwierdzeniu odpowiedzi klienta zostaną zablokowane do edycji.</p>`;
  const ok=document.getElementById('dlg-send-ok');
  ok.innerHTML=icon('send')+(remind?'Wyślij przypomnienie':'Wyślij ankietę');
  ok.onclick=()=>{
    if(remind){addEvent(a,'Wysłano przypomnienie o ankiecie do '+a.contact);toast('Przypomnienie wysłane do '+a.contact+'.');}
    else{a.survey='sent';a.test='blocked';a.expires='2026-10-01';addEvent(a,'Wysłano ankietę do '+a.contact);toast('Ankieta wysłana do '+a.contact+'. Link ważny do '+fmtDate(a.expires)+'.');}
    dlg.close();render();
  };
  dlg.showModal();
}
dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]'))dlg.close()});

document.addEventListener('click',e=>{
  const seg_=e.target.closest('[data-seg]');if(seg_){seg=seg_.dataset.seg;render();return}
  const qk=e.target.closest('[data-quick]');if(qk){quick=quick===qk.dataset.quick?'':qk.dataset.quick;render();return}
  const srt=e.target.closest('[data-sort]');if(srt){const k=srt.dataset.sort;if(sort.key===k)sort.dir*=-1;else sort={key:k,dir:1};render();return}
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;location.hash=`#klient/${currentId}/${encodeURIComponent(tab)}`;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.id?byId(b.dataset.id):null;
  switch(b.dataset.act){
    case 'clear':quick='';q='';render();break;
    case 'reset':if(confirm('Przywrócić dane przykładowe? Twoje zmiany w makiecie zostaną usunięte.')){localStorage.removeItem(VERSION);S=seed();render();toast('Dane przykładowe przywrócone.')}break;
    case 'send':openSend(a,'send');break;
    case 'remind':openSend(a,'remind');break;
    case 'test':location.hash=`#klient/${a.id}/Test`;break;
    case 'note':location.hash=`#klient/${a.id}/${encodeURIComponent('Rozmowy i notatki')}`;setTimeout(()=>document.getElementById('note-text')?.focus(),50);break;
    case 'rerun':{const d=unresolved(a);a.test=d.length?'internal_issues':(a.checks.client?'client_ok':'internal_ok');addEvent(a,d.length?`Test wewnętrzny: ${d.length} ${plural(d.length,'rozbieżność','rozbieżności','rozbieżności')}`:'Test wewnętrzny: bez rozbieżności');render();toast(d.length?'Porównanie zakończone: są rozbieżności.':'Porównanie zakończone: konfiguracja zgodna.');break}
    case 'ready':a.test='ready';addEvent(a,'Oznaczono jako gotowe do startu');render();toast(a.client+': gotowe do startu.');break;
    case 'edit-rules':toast('Edycja zasad — w makiecie tylko podgląd.');break;
    case 'upload':toast('Wgrywanie plików — w makiecie tylko podgląd.');break;
    case 'toast':toast(b.dataset.msg||'OK');break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const rows=filtered();const tbody=main.querySelector('tbody');/* pełny render psułby fokus w polu — odświeżamy tylko tabelę i licznik */
    const tmp=document.createElement('div');tmp.innerHTML=renderList();const nt=tmp.querySelector('tbody'),ne=tmp.querySelector('.empty');const panel=main.querySelector('.panel');
    const wrap=panel.querySelector('.tablewrap'),emp=panel.querySelector('.empty');
    if(wrap)wrap.remove();if(emp)emp.remove();
    panel.appendChild(nt?tmp.querySelector('.tablewrap'):ne);
    main.querySelector('#list-title').textContent=`${rows.length} ${plural(rows.length,'głosowanie','głosowania','głosowań')}`;
    main.querySelector('.clearfilter').classList.toggle('on',!!(quick||q));
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-range]')){range=e.target.value;render();return}
  const c=e.target.closest('[data-check]');if(c){const a=byId(c.dataset.id);const k=c.dataset.check;if(c.checked){a.checks[k]={by:a.owner,at:now()};if(k==='client'&&a.test==='internal_ok')a.test='client_ok';}else delete a.checks[k];save();render();}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form="note"]');if(!f)return;e.preventDefault();
  const a=byId(f.dataset.id);const text=f.text.value.trim();if(!text)return;
  a.notes.unshift({text,by:a.owner,at:now()});addEvent(a,'Dodano notatkę');render();toast('Notatka zapisana.');
});
route();
</script>
</body>
</html>
